# Local-only Actual Budget integration overlay.
#
# Start together with the Finance Sync and Wealthfolio overlays:
#   docker compose -f docker-compose.yml \
#     -f docker-compose.local-wealthfolio.yml \
#     -f docker-compose.local-actual-budget.yml up -d --build

services:
  actual-budget:
    image: actualbudget/actual-server:latest
    container_name: finance-sync-actual-budget-local
    restart: unless-stopped
    ports:
      - "5006:5006"
    volumes:
      - actual_budget_local_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5006/').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  actual_budget_local_data:
    driver: local
