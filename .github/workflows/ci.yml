# =============================================================================
# CI Pipeline — finance-sync
# =============================================================================
# Runs on push/PR to main.  Nine independent jobs:
#
#   lint         – Ruff check + format check
#   types        – Pyright strict mode
#   test         – Pytest unit suite (aiosqlite, no external services)
#   migrations   – Alembic upgrade head against an empty PostgreSQL
#   integration  – Pytest `-m integration` against ephemeral PG + Redis
#   e2e          – Pytest `-m e2e` (API→worker exactly-once) against ephemeral PG + Redis
#   security     – pip-audit vulnerability scan + CycloneDX SBOM
#   openapi-diff – OpenAPI public-surface diff (PRs only, no secrets)
#   build        – Docker image build, Trivy image scan (fail on HIGH/CRITICAL), push on main
#
# The integration/e2e jobs fail on unexpected test skips (the PG/Redis
# gate must actually run) and upload JUnit + service-container logs as
# CI artifacts; the migrations job uploads its upgrade/downgrade logs.
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: lint-${{ matrix.python-version }}

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff lint check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

  # ── Type check ────────────────────────────────────────────────────────
  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: types-${{ matrix.python-version }}

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Restore Pyright cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pyright
          key: >-
            pyright-${{ runner.os }}-${{ matrix.python-version }}-
            ${{ hashFiles('**/*.py', 'pyproject.toml') }}
          restore-keys: |
            pyright-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run Pyright (strict)
        # G-11: src/ checked strict (pyproject.toml [tool.pyright]); tests/
        # checked at basic via its own config. Two invocations so each uses
        # its declared typeCheckingMode.
        run: |
          uv run pyright -p pyproject.toml src
          uv run pyright -p pyrightconfig.tests.json tests

      - name: Enforce Pyright warning budget
        run: >-
          uv run python scripts/check_pyright_budget.py
          --baseline config/pyright-warning-budget.json src

  # ── Test + coverage ───────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: test-${{ matrix.python-version }}

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Restore pytest cache
        uses: actions/cache@v6
        with:
          path: .pytest_cache
          key: >-
            pytest-${{ runner.os }}-${{ matrix.python-version }}-
            ${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pytest-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run unit tests with coverage (≥73%)
        run: >-
          uv run pytest -m "not integration and not e2e"
          --cov=finance_sync
          --cov-report=term
          --cov-report=xml
          --cov-fail-under=73
          --junitxml=junit.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 14

  # ── Migration upgrade test ──────────────────────────────────────────
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: migrations

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Check migration chain is linear
        run: >
          uv run alembic history
          | uv run python -c
          "import sys; lines=[l for l in sys.stdin if l.strip()];
          assert len([l for l in lines if '(head)' in l]) == 1, 'expected exactly one head';
          print(f'linear chain OK: {len(lines)} revisions, single head')"
        env:
          ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_sync_test

      - name: Run alembic upgrade head on empty database
        run: uv run alembic upgrade head 2>&1 | tee migration-upgrade.log
        env:
          ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_sync_test

      - name: Verify migration downgrade and upgrade round-trip
        run: |
          uv run alembic downgrade base 2>&1 | tee migration-downgrade.log
          uv run alembic upgrade head 2>&1 | tee -a migration-upgrade.log
        env:
          ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_sync_test

      - name: Verify export tables exist after migration
        run: |
          uv run python - <<'PY'
          import asyncio
          import os

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main() -> None:
              engine = create_async_engine(os.environ["ASYNC_DB_URL"])
              async with engine.connect() as conn:
                  for table in (
                      "export_runs",
                      "export_deliveries",
                      "ab_account_mappings",
                      "wealthfolio_deliveries",
                  ):
                      result = await conn.execute(
                          text(f"SELECT to_regclass('public.{table}')")
                      )
                      assert result.scalar() == table, f"missing table {table}"
                      print(f"{table}: OK")
              await engine.dispose()

          asyncio.run(main())
          PY
        env:
          ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_sync_test

      - name: Upload migration logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-logs
          path: |
            migration-upgrade.log
            migration-downgrade.log
          retention-days: 14

  # ── Integration tests (real PG + Redis) ────────────────────────────
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: integration

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run integration tests (real PostgreSQL + Redis)
        run: |
          set -o pipefail
          uv run pytest -m integration -v --junitxml=junit-integration.xml \
            2>&1 | tee integration.log
          uv run pytest tests/integration/test_read_query_benchmarks_pg.py -m integration -q
          uv run python scripts/check_junit_no_skips.py junit-integration.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_sync_test
          TEST_REDIS_URL: redis://localhost:6379/15
          READ_BENCHMARK_ARTIFACT: read-benchmarks.json

      - name: Fail on unexpected integration test skips
        # Gate: the formal PG/Redis validation must actually run.  A skip
        # here means the suite silently did nothing — make the job red.
        # (The harness uses pytest.skip() only when TEST_DATABASE_URL /
        # TEST_REDIS_URL are unset and not in CI — i.e. never in CI.)
        run: |
          SKIPPED=$(uv run python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('junit-integration.xml')
          skipped = int(tree.getroot().get('skipped', 0))
          print(skipped)
          ")
          echo "Integration skipped tests: ${SKIPPED}"
          if [ "${SKIPPED}" -ne 0 ]; then
            echo "❌ Unexpected integration test skips (${SKIPPED}) — the PG/Redis gate did not fully run."
            exit 1
          fi
          echo "✅ No unexpected integration test skips."

      - name: Capture service container logs
        if: always()
        run: |
          docker logs "${{ job.services.postgres.id }}" > pg-service.log 2>&1 || true
          docker logs "${{ job.services.redis.id }}" > redis-service.log 2>&1 || true

      - name: Upload integration test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-junit
          path: junit-integration.xml
          retention-days: 14

      - name: Upload integration service logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-service-logs
          path: |
            pg-service.log
            redis-service.log
          retention-days: 14
      - name: Compare read performance with baseline
        run: >
          DEBUG=false uv run python scripts/check_read_performance.py
          --baseline config/read-performance-baseline.json
          --current read-benchmarks.json
          --report read-performance-comparison.json
          --latency-tolerance 0.25
        env:
          PERF_FAIL_LATENCY: "false"

      - name: Upload PostgreSQL read benchmark report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: read-query-benchmarks
          path: read-benchmarks.json
          retention-days: 14

      - name: Upload read performance comparison
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: read-performance-comparison
          path: read-performance-comparison.json
          retention-days: 14

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: e2e

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run e2e tests (API → worker exactly-once, real PG + Redis)
        run: |
          set -o pipefail
          uv run pytest -m e2e -v --junitxml=junit-e2e.xml 2>&1 \
            | tee e2e.log
          uv run python scripts/check_junit_no_skips.py junit-e2e.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_sync_test
          TEST_REDIS_URL: redis://localhost:6379/15

      - name: Fail on unexpected e2e test skips
        # Gate: the exactly-once pipeline validation must actually run.
        run: |
          SKIPPED=$(uv run python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('junit-e2e.xml')
          skipped = int(tree.getroot().get('skipped', 0))
          print(skipped)
          ")
          echo "E2E skipped tests: ${SKIPPED}"
          if [ "${SKIPPED}" -ne 0 ]; then
            echo "❌ Unexpected e2e test skips (${SKIPPED}) — the exactly-once gate did not fully run."
            exit 1
          fi
          echo "✅ No unexpected e2e test skips."

      - name: Capture service container logs
        if: always()
        run: |
          docker logs "${{ job.services.postgres.id }}" > pg-service.log 2>&1 || true
          docker logs "${{ job.services.redis.id }}" > redis-service.log 2>&1 || true

      - name: Upload e2e test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-junit
          path: junit-e2e.xml
          retention-days: 14

      - name: Upload e2e service logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-service-logs
          path: |
            pg-service.log
            redis-service.log
          retention-days: 14


  # ── Provider contract refresh ─────────────────────────────────────────
  provider-contracts:
    name: Provider contract refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: provider-contracts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Validate synthetic provider compatibility matrix
        run: >
          uv run python scripts/provider_contract_refresh.py
          --matrix config/provider-contract-matrix.json
          --artifact provider-contract-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: provider-contracts-${{ github.sha }}
          path: provider-contract-report.json
          retention-days: 30

  # ── Capacity-limit measurements ──────────────────────────────────────
  capacity-limits:
    name: Capacity limits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: capacity-limits
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Measure synthetic capacity profiles
        run: >
          uv run python scripts/capacity_limit_report.py
          --config config/capacity-limits.json
          --artifact capacity-limits.json
      - uses: actions/upload-artifact@v7
        with:
          name: capacity-limits-${{ github.sha }}
          path: capacity-limits.json
          retention-days: 30

  # ── Connector version lifecycle ───────────────────────────────────────
  connector-lifecycle:
    name: Connector lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: connector-lifecycle
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - run: >
          DEBUG=false uv run pytest -q
          tests/test_release18_connector_lifecycle.py
          tests/test_connector_lifecycle_evidence.py
          tests/test_connector_releases.py
          tests/test_provider_health.py
      - name: Secret-redaction and synthetic lifecycle gate
        run: >
          DEBUG=false uv run pytest -q
          tests/test_connector_lifecycle_observability.py
          tests/test_connection_audit.py
          tests/test_connectors_multi_connection.py
      - name: Publish safe connector lifecycle diagnostics
        run: >
          uv run python scripts/connector_lifecycle.py
          --config config/connector-lifecycle.json
          --artifact connector-lifecycle-report.json
      - name: Build release evidence artifact
        run: >
          uv run python scripts/connector_lifecycle_evidence.py
          --output connector-lifecycle-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: connector-lifecycle-${{ github.sha }}
          path: |
            connector-lifecycle-report.json
            connector-lifecycle-evidence.json
          retention-days: 30

  # ── Autoscaling and backpressure policy ──────────────────────────────
  autoscaling-policy:
    name: Autoscaling policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: autoscaling-policy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - run: DEBUG=false uv run pytest tests/test_release18_autoscaling.py -q
      - name: Publish baseline autoscaling decision
        run: >
          uv run python scripts/autoscaling_policy.py
          --policy config/autoscaling-policy.json
          --artifact autoscaling-decision.json
      - uses: actions/upload-artifact@v7
        with:
          name: autoscaling-policy-${{ github.sha }}
          path: autoscaling-decision.json
          retention-days: 30

  # ── Audit retention enforcement ───────────────────────────────────────
  audit-retention:
    name: Audit retention enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: audit-retention
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Run tenant-scoped retention dry-run
        run: >
          uv run python scripts/enforce_audit_retention.py
          --policy config/audit-retention-policy.json
          --tenant synthetic-tenant
          --artifact audit-retention-run.json
          --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: audit-retention-${{ github.sha }}
          path: audit-retention-run.json
          retention-days: 30

  # ── Managed key provider contract ─────────────────────────────────────
  managed-key-provider:
    name: Managed key provider
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: managed-key-provider
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - run: DEBUG=false uv run pytest tests/test_release18_managed_key_provider.py -q

  # ── Automated disaster-recovery runbook ──────────────────────────────
  automated-dr:
    name: Automated DR runbook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: automated-dr
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Execute isolated dry-run recovery
        run: >
          uv run python scripts/automated_dr_runbook.py
          --config config/automated-dr-runbook.json
          --artifact automated-dr-runbook.json
          --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: automated-dr-${{ github.sha }}
          path: automated-dr-runbook.json
          retention-days: 30

  # ── Periodic DR SLA (RPO/RTO) monitoring ────────────────────────────
  dr-sla-monitoring:
    name: DR SLA monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Create isolated restore database
        run: createdb -h localhost -U postgres finance_sync_restore
        env:
          PGPASSWORD: postgres
      - name: Run synthetic DR restore-check
        run: >
          python3 scripts/dr_sla_monitoring.py
          --config config/dr-sla-monitoring.json
          --artifact dr-sla-monitoring.json
          --source-url postgresql://postgres:postgres@localhost:5432/finance_sync_test
          --target-url postgresql://postgres:postgres@localhost:5432/finance_sync_restore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dr-sla-monitoring-${{ github.sha }}
          path: dr-sla-monitoring.json
          retention-days: 30

  # ── Encryption key-rotation drill ────────────────────────────────────
  key-rotation:
    name: Encryption key rotation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: key-rotation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Run synthetic key rotation and restore checks
        run: >
          uv run python scripts/key_rotation_drill.py
          --config config/key-rotation-drill.json
          --artifact key-rotation-drill.json
      - uses: actions/upload-artifact@v7
        with:
          name: key-rotation-${{ github.sha }}
          path: key-rotation-drill.json
          retention-days: 30

  # ── Disaster-recovery game day ────────────────────────────────────────
  dr-game-day:
    name: Disaster-recovery game day
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: dr-game-day
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Simulate database, Redis and worker loss
        run: >
          uv run python scripts/dr_game_day.py
          --config config/dr-game-day.json
          --artifact dr-game-day.json
      - uses: actions/upload-artifact@v7
        with:
          name: dr-game-day-${{ github.sha }}
          path: dr-game-day.json
          retention-days: 30

  # ── PostgreSQL backup/restore drill ───────────────────────────────────
  backup-restore:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Create isolated restore database
        run: createdb -h localhost -U postgres finance_sync_restore
        env:
          PGPASSWORD: postgres
      - name: Run synthetic PostgreSQL backup/restore drill
        run: >
          python3 scripts/backup_restore_drill.py
          --source-url postgresql://postgres:postgres@localhost:5432/finance_sync_test
          --target-url postgresql://postgres:postgres@localhost:5432/finance_sync_restore
          --artifact backup-restore-drill.json
        env:
          MIGRATION_HEAD: alembic-head
      - uses: actions/upload-artifact@v7
        with:
          name: backup-restore-drill-${{ github.sha }}
          path: backup-restore-drill.json
          retention-days: 30

  # ── Connector retry/rate-limit chaos matrix ──────────────────────────
  connector-chaos:
    name: Connector chaos and retry tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: connector-chaos
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Run synthetic bank and broker chaos fixtures
        run: DEBUG=false uv run pytest tests/test_release16_connector_chaos.py -q

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: security

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: uv sync --extra dev --frozen

      - name: Install security & SBOM tooling
        run: uv pip install pip-audit cyclonedx-bom

      - name: Export locked release requirements
        run: >-
          uv export --format requirements-txt --no-dev --locked
          --no-emit-project --output-file release-requirements.txt

      - name: Scan dependencies for vulnerabilities
        run: >-
          uv run pip-audit --requirement release-requirements.txt
          --progress-spinner=off
          --ignore-vuln PYSEC-2026-1325
          --ignore-vuln GHSA-wj6h-64fc-37mp

      - name: Generate CycloneDX SBOM
        run: >-
          uv run cyclonedx-py requirements release-requirements.txt
          --pyproject pyproject.toml -o sbom.cyclonedx.json

      - name: Validate Trivy accepted-risk expiry policy
        run: uv run python scripts/check_trivyignore.py .trivyignore

      - name: Generate security exception lifecycle report
        run: >-
          uv run python -m scripts.security_exception_report
          .trivyignore security-exceptions.json

      - name: Validate data retention and privacy policy
        run: uv run python scripts/check_data_retention_policy.py config/data-retention-policy.json

      - name: Validate SLO and alert policy
        run: uv run python scripts/check_slo_alerts.py config/slo-alerts.json

      - name: Validate audit trail completeness
        run: >
          uv run python scripts/audit_trail_completeness.py
          --policy config/audit-trail-policy.json
          --example config/incident-audit-example.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cyclonedx.json
            release-requirements.txt
            security-exceptions.json
            config/data-retention-policy.json
          retention-days: 30

  # ── OpenAPI public-surface diff (PRs only) ─────────────────────────
  # G-11: every pull request must keep the API's public surface backward
  # compatible.  Generates /openapi.json (FastAPI app.openapi()) for both
  # the PR head and the merge base, then fails on prohibited changes
  # (removed paths/operations, changed operationIds, removed required
  # fields, ...).  Additive-only changes are allowed — policy documented
  # in README ("API contract (OpenAPI) diff gate").  Requires no secrets:
  # schema generation imports the app without starting the lifespan.
  openapi-diff:
    name: OpenAPI diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: openapi-diff

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (head)
        run: uv sync --extra dev --frozen

      - name: Generate OpenAPI document (PR head)
        run: uv run python scripts/generate_openapi.py --output openapi-head.json

      - name: Checkout merge base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install dependencies (merge base)
        working-directory: base
        run: uv sync --extra dev --frozen

      - name: Generate OpenAPI document (merge base)
        working-directory: base
        run: uv run python ../scripts/generate_openapi.py --output ../openapi-base.json

      - name: Diff OpenAPI public surface (base vs head)
        run: >-
          uv run python scripts/check_openapi_diff.py
          --base openapi-base.json
          --head openapi-head.json
          --allowlist scripts/openapi_diff_allowlist.json
          --report openapi-diff.json

      - name: Upload OpenAPI documents
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openapi-docs
          path: |
            openapi-head.json
            openapi-base.json
            openapi-diff.json
          retention-days: 14

  # ── Docker build, image scan & push ─────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write    # needed to push to ghcr.io
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and load Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            finance-sync:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        # G-11: image vulnerability gate. Scans the locally built image
        # (loaded above) and fails the job on HIGH/CRITICAL findings that
        # are not recorded in the accepted-risk baseline (.trivyignore).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finance-sync:scan
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: false
          trivyignores: .trivyignore
          format: json
          output: trivy-results.json
          version: v0.70.0

      - name: Write image scan provenance
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_TAG: finance-sync:scan
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("trivy-provenance.json").write_text(
              json.dumps(
                  {
                      "commit": os.environ["COMMIT_SHA"],
                      "image": os.environ["IMAGE_TAG"],
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

      - name: Upload image scan results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-${{ github.sha }}
          path: |
            trivy-results.json
            trivy-provenance.json
          retention-days: 30

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
