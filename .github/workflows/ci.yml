# =============================================================================
# CI Pipeline — finance-sync
# =============================================================================
# Runs on push/PR to main.  Nine independent jobs:
#
#   lint        – Ruff check + format check
#   types       – Pyright strict mode
#   test        – Pytest unit suite (aiosqlite, no external services)
#   migrations  – Alembic upgrade head against an empty PostgreSQL
#   integration – Pytest `-m integration` against ephemeral PG + Redis
#   e2e         – Pytest `-m e2e` (API→worker exactly-once) against ephemeral PG + Redis
#   security    – pip-audit vulnerability scan + CycloneDX SBOM
#   build       – Docker image build, Trivy image scan (fail on HIGH/CRITICAL), push on main
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: lint-${{ matrix.python-version }}

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff lint check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

  # ── Type check ────────────────────────────────────────────────────────
  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: types-${{ matrix.python-version }}

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Restore Pyright cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pyright
          key: >-
            pyright-${{ runner.os }}-${{ matrix.python-version }}-
            ${{ hashFiles('**/*.py', 'pyproject.toml') }}
          restore-keys: |
            pyright-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run Pyright (strict)
        # G-11: src/ checked strict (pyproject.toml [tool.pyright]); tests/
        # checked at basic via its own config. Two invocations so each uses
        # its declared typeCheckingMode.
        run: |
          uv run pyright -p pyproject.toml src
          uv run pyright -p pyrightconfig.tests.json tests

  # ── Test + coverage ───────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: test-${{ matrix.python-version }}

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Restore pytest cache
        uses: actions/cache@v6
        with:
          path: .pytest_cache
          key: >-
            pytest-${{ runner.os }}-${{ matrix.python-version }}-
            ${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pytest-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run unit tests with coverage (≥70%)
        run: >-
          uv run pytest -m "not integration and not e2e"
          --cov=finance_sync
          --cov-report=term
          --cov-report=xml
          --cov-fail-under=70
          --junitxml=junit.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 14

  # ── Migration upgrade test ──────────────────────────────────────────
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: migrations

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Check migration chain is linear
        run: >
          uv run alembic history
          | uv run python -c
          "import sys; lines=[l for l in sys.stdin if l.strip()];
          assert len([l for l in lines if '(head)' in l]) == 1, 'expected exactly one head';
          print(f'linear chain OK: {len(lines)} revisions, single head')"
        env:
          ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_sync_test

      - name: Run alembic upgrade head on empty database
        run: uv run alembic upgrade head
        env:
          ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_sync_test

      - name: Verify export tables exist after migration
        run: |
          uv run python - <<'PY'
          import asyncio
          import os

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main() -> None:
              engine = create_async_engine(os.environ["ASYNC_DB_URL"])
              async with engine.connect() as conn:
                  for table in (
                      "export_runs",
                      "export_deliveries",
                      "ab_account_mappings",
                      "wealthfolio_deliveries",
                  ):
                      result = await conn.execute(
                          text(f"SELECT to_regclass('public.{table}')")
                      )
                      assert result.scalar() == table, f"missing table {table}"
                      print(f"{table}: OK")
              await engine.dispose()

          asyncio.run(main())
          PY
        env:
          ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_sync_test

  # ── Integration tests (real PG + Redis) ────────────────────────────
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: integration

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run integration tests (real PostgreSQL + Redis)
        run: uv run pytest -m integration -v --junitxml=junit-integration.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_sync_test
          TEST_REDIS_URL: redis://localhost:6379/15

      - name: Upload integration test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-junit
          path: junit-integration.xml
          retention-days: 14

  # ── E2E tests (full API → worker → outbox pipeline) ──────────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: e2e

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run e2e tests (API → worker exactly-once, real PG + Redis)
        run: uv run pytest -m e2e -v --junitxml=junit-e2e.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_sync_test
          TEST_REDIS_URL: redis://localhost:6379/15

      - name: Upload e2e test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-junit
          path: junit-e2e.xml
          retention-days: 14

  # ── Security + SBOM ───────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: security

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: uv sync --extra dev --frozen

      - name: Install security & SBOM tooling
        run: uv pip install pip-audit cyclonedx-bom

      - name: Scan dependencies for vulnerabilities
        run: uv run pip-audit --progress-spinner=off --skip-editable --ignore-vuln PYSEC-2026-1325 --ignore-vuln GHSA-wj6h-64fc-37mp

      - name: Generate CycloneDX SBOM
        run: |
          uv run pip freeze --all \
            | uv run cyclonedx-py requirements - \
              --pyproject pyproject.toml \
              -o sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 30

  # ── Docker build, image scan & push ─────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write    # needed to push to ghcr.io
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and load Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            finance-sync:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        # G-11: image vulnerability gate. Scans the locally built image
        # (loaded above) and fails the job on HIGH/CRITICAL findings that
        # are not recorded in the accepted-risk baseline (.trivyignore).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finance-sync:scan
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: false
          trivyignores: .trivyignore
          version: v0.70.0

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  # ── Deploy to Coolify ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Coolify
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Coolify deployment
        id: deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: https://dev.7rb.nl
          APP_UUID: obcopz3142hxzs1zlie78amh
        run: |
          echo "📦 Deploying finance-sync (${{ needs.build.outputs.image_tag }}) to Coolify..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${COOLIFY_BASE_URL}/api/v1/deploy" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"${APP_UUID}\", \"force\": false}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Status: ${HTTP_CODE}"
          echo "Response: ${BODY}"
          DEPLOY_UUID=$(echo "$BODY" | python3 -c "import sys,json;d=json.load(sys.stdin);deploys=d.get('deployments',[]);print(deploys[0].get('deployment_uuid','unknown') if deploys else 'unknown')" 2>/dev/null || echo "unknown")
          echo "deployment_uuid=${DEPLOY_UUID}" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Deploy triggered (uuid: ${DEPLOY_UUID})"
          else
            echo "❌ Deploy failed (HTTP ${HTTP_CODE})"
            exit 1
          fi
