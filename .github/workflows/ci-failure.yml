name: Report main CI incidents

on:
  workflow_run:
    workflows: [CI, Deploy to Coolify, Publish SDK to PyPI]
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  report:
    # PR failures belong to the PR checks, not the repository incident queue.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch ==
      github.event.repository.default_branch &&
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Create or resolve deduplicated incident issues
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const conclusion = run.conclusion;
            const markerPrefix = '<!-- ci-failure-fingerprint:';

            const normalize = (value) =>
              (value || '').toString().trim().toLowerCase()
                .replace(/[^a-z0-9_.-]+/g, '-').replace(/^-|-$/g, '') || 'unknown';

            const category = (job, step) => {
              const value = `${job} ${step}`.toLowerCase();
              if (/security|trivy|audit|sbom/.test(value)) return 'security';
              if (/lint|ruff|format/.test(value)) return 'lint';
              if (/test|pytest|integration|e2e/.test(value)) return 'test';
              if (/build|docker|image/.test(value)) return 'build';
              if (/deploy|release|publish/.test(value)) return 'release';
              return 'other';
            };

            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner: repo.owner, repo: repo.repo, run_id: run.id,
              per_page: 100,
            });
            const jobs = jobsResponse.data.jobs;
            let artifacts = [];
            try {
              const artifactResponse = await github.rest.actions.listWorkflowRunArtifacts({
                owner: repo.owner, repo: repo.repo, run_id: run.id,
                per_page: 100,
              });
              artifacts = artifactResponse.data.artifacts.map((artifact) =>
                `- [${artifact.name}](${artifact.archive_download_url})`);
            } catch (error) {
              console.warn(`Could not fetch artifacts: ${error.message}`);
            }
            const failed = jobs.filter((job) =>
              job.conclusion === 'failure' || job.conclusion === 'timed_out');
            const successful = jobs.filter((job) => job.conclusion === 'success');

            const firstFailedStep = (job) => {
              const step = (job.steps || []).find((item) =>
                item.conclusion === 'failure' || item.conclusion === 'timed_out');
              return step ? step.name : 'unknown-step';
            };
            const key = (job, step) => [
              normalize(run.name), normalize(job.name), normalize(defaultBranch),
              normalize(category(job.name, step)),
            ].join('|');

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner: repo.owner, repo: repo.repo, state: 'open', labels: 'ci-failure', per_page: 100 }
            );
            const matching = (fingerprint) => openIssues.filter((issue) =>
              (issue.body || '').includes(`${markerPrefix}${fingerprint} -->`));

            const closeForJob = async (job) => {
              const prefix = `${markerPrefix}${normalize(run.name)}|${normalize(job.name)}|${normalize(defaultBranch)}|`;
              for (const issue of openIssues.filter((item) => (item.body || '').includes(prefix))) {
                await github.rest.issues.update({
                  owner: repo.owner, repo: repo.repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed',
                });
                console.log(`Closed recovered CI incident #${issue.number}`);
              }
            };

            if (conclusion === 'success') {
              for (const job of successful) await closeForJob(job);
              return;
            }

            for (const job of failed) {
              const step = firstFailedStep(job);
              const fingerprint = key(job, step);
              const existing = matching(fingerprint)[0];
              const details = [
                `**Workflow:** ${run.name}`,
                `**Branch:** \`${run.head_branch}\``,
                `**Job:** ${job.name}`,
                `**Failed step:** ${step}`,
                `**Run:** [#${run.run_number}](${run.html_url})`,
                `**Commit:** \`${run.head_sha}\``,
                `**Conclusion:** \`${conclusion}\``,
                `**Timestamp:** ${new Date().toISOString()}`,
                '**Artifacts:**',
                artifacts.length ? artifacts.join('\n') : '_(none available)_',
              ].join('\n');
              if (existing) {
                await github.rest.issues.createComment({
                  owner: repo.owner, repo: repo.repo, issue_number: existing.number,
                  body: `## Repeated CI failure\n\n${details}`,
                });
                continue;
              }
              const labels = ['ci-failure', 'scope:main', `workflow:${normalize(run.name)}`, `type:${normalize(category(job.name, step))}`];
              const body = [
                '## CI failure on the default branch', '', details, '',
                'This incident is deduplicated by workflow, job, branch and failure category.',
                'A successful subsequent run of the same job closes it automatically.', '',
                `${markerPrefix}${fingerprint} -->`,
              ].join('\n');
              await github.rest.issues.create({
                owner: repo.owner, repo: repo.repo,
                title: `[CI] ${run.name}: ${job.name} (${category(job.name, step)})`,
                body, labels,
              });
            }
