name: Deploy to Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        id: deploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          echo "Triggering Coolify deployment for finance-sync..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://dev.7rb.nl/api/v1/deploy" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "obcopz3142hxzs1zlie78amh", "force": false}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Status: ${HTTP_CODE}"
          echo "Response: ${BODY}"
          DEPLOY_UUID=$(echo "${BODY}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('deployments',[{}])[0].get('deployment_uuid','unknown'))" 2>/dev/null || echo "unknown")
          echo "deployment_uuid=${DEPLOY_UUID}" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Deploy triggered (uuid: ${DEPLOY_UUID})"
          else
            echo "❌ Deploy failed (HTTP ${HTTP_CODE})"
            exit 1
          fi
