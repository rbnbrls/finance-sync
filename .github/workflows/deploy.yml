name: Deploy to Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger Coolify deployment
        id: deploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          echo "Triggering Coolify deployment for finance-sync..."
          # Target finance-sync-staging (mdeal4aqq9ycnozn3mg83zix): the former
          # production app (obcopz3142hxzs1zlie78amh) no longer exists on
          # dev.7rb.nl, and staging is the only finance-sync app deployed there.
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://dev.7rb.nl/api/v1/deploy" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "mdeal4aqq9ycnozn3mg83zix", "force": false}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Status: ${HTTP_CODE}"
          echo "Response: ${BODY}"
          DEPLOY_UUID=$(echo "${BODY}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('deployments',[{}])[0].get('deployment_uuid','unknown'))" 2>/dev/null || echo "unknown")
          echo "deployment_uuid=${DEPLOY_UUID}" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Deploy triggered (uuid: ${DEPLOY_UUID})"
          else
            echo "❌ Deploy failed (HTTP ${HTTP_CODE})"
            exit 1
          fi

      - name: Wait for Coolify deployment to finish
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          if [ -z "${DEPLOYMENT_UUID}" ] || [ "${DEPLOYMENT_UUID}" = "unknown" ]; then
            echo "❌ No deployment UUID to poll"
            exit 1
          fi
          for i in $(seq 1 90); do
            STATUS=$(curl -s -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "https://dev.7rb.nl/api/v1/deployments/${DEPLOYMENT_UUID}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || true)
            echo "[$i] deployment status: ${STATUS}"
            case "${STATUS}" in
              finished) echo "✅ Coolify deployment finished"; exit 0 ;;
              failed|error|cancelled) echo "❌ Coolify deployment ${STATUS}"; exit 1 ;;
            esac
            sleep 15
          done
          echo "❌ Timed out waiting for Coolify deployment"
          exit 1
