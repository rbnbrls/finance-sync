# =============================================================================
# Deploy to Coolify — finance-sync production
# =============================================================================
# Pushes to main trigger a redeploy of the production Coolify app
# (finance-sync-production). The application UUID is deliberately NOT committed:
# Coolify UUIDs change on every recreation and a stale one turns every push into
# an HTTP 404 (issue #430 — the production app was recreated twice). The target
# is resolved from the provider by name at run time, see
# scripts/resolve-coolify-app.sh.
#
# Pipeline:
#   0. Resolve   — read the application (uuid + served domain) back from Coolify
#                  by name; fails closed with a typed reason when it is missing
#                  or ambiguous.
#   1. Trigger   — POST /api/v1/deploy {uuid, force:true}. force=true rebuilds
#                  and redeploys the current commit even when Coolify's queue
#                  thinks the app is already up to date (needed after the app
#                  recreation — see issue #430).
#   2. Wait      — poll GET /api/v1/deployments/{uuid} until finished/failed.
#   3. Health    — poll the REAL health endpoints (/health/live + /health/ready,
#                  body status "ok") on the domain Coolify actually serves.
#                  Coolify reporting "finished" is not proof the container serves
#                  traffic (issue #430: run #206 reported finished while the
#                  container crashed at startup), so the workflow verifies the
#                  app before declaring success.
#
# The Coolify API token lives in the COOLIFY_API_TOKEN GitHub secret and is
# only referenced via ${{ secrets.* }} / the env block — never echoed.
# =============================================================================
name: Deploy to Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve production application
        # No UUID is committed anywhere: it is read back from the provider so a
        # recreation cannot leave this workflow pointing at a deleted app.
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: https://dev.7rb.nl
          # Optional repository variable; defaults to <repo>-production so a
          # renamed application needs no code change either.
          COOLIFY_APP_NAME_PRODUCTION: ${{ vars.COOLIFY_APP_NAME_PRODUCTION }}
        run: |
          APP_NAME="${COOLIFY_APP_NAME_PRODUCTION:-$(basename "${GITHUB_REPOSITORY}")-production}"
          echo "Resolving Coolify application ${APP_NAME} on ${COOLIFY_BASE_URL}..."
          # The resolver's typed reason is surfaced as a run annotation, because
          # the operator's next action depends on which reason it is: a target
          # that does not exist on the plane is recreated, a token problem is
          # not (issue #1005 - every push to main failed here with HTTP 404
          # `{"message":"No resources found."}` from a committed uuid).
          REASON_FILE=$(mktemp)
          if ! RESOLVED=$(./scripts/resolve-coolify-app.sh --name "${APP_NAME}" --prefix COOLIFY_APP 2>"${REASON_FILE}"); then
            REASON=$(tr -d '\n' < "${REASON_FILE}")
            echo "::error title=Coolify deploy target unresolved::${REASON} - this workflow resolves its Coolify application by name at run time (no uuid is committed). 'coolify_application_not_found' means no application with that name exists on ${COOLIFY_BASE_URL}: recreate it in Coolify, or point the COOLIFY_APP_NAME_PRODUCTION repository variable at the application that should receive this push. Until then this push deploys nothing."
            exit 1
          fi
          printf '%s\n' "${RESOLVED}" >> "${GITHUB_ENV}"
          printf '%s\n' "${RESOLVED}"

      - name: Trigger Coolify deployment
        id: deploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "${COOLIFY_APP_UUID:-}" ] || [ -z "${COOLIFY_APP_DOMAIN:-}" ]; then
            echo "❌ No resolved Coolify target (uuid/domain) — the resolve step must run first"
            exit 1
          fi
          echo "Triggering Coolify deployment for ${COOLIFY_APP_UUID} (${COOLIFY_APP_DOMAIN})..."
          # force=true: rebuild + redeploy the current commit even when the
          # Coolify deployment queue thinks the app is already up to date.
          # Required after the 2026-08-25 app recreation (#430): the previous
          # deploy (run #206) built the image but the container crashed at
          # startup (env vars were provisioned ~12 min later), and no
          # subsequent redeploy was triggered.
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://dev.7rb.nl/api/v1/deploy" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"${COOLIFY_APP_UUID}\", \"force\": true}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Status: ${HTTP_CODE}"
          # Never print a provider response verbatim: redact token-shaped values
          # before logging diagnostics if Coolify ever echoes request metadata.
          SAFE_BODY=$(printf '%s' "${BODY}" | sed -E \
            -e 's/(Bearer[[:space:]]+)[^"[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(COOLIFY_API_TOKEN[=:][[:space:]]*)[^,}[:space:]]+/\1[REDACTED]/Ig')
          echo "Response: ${SAFE_BODY}"
          DEPLOY_UUID=$(echo "${BODY}" | python3 -c "import sys,json; d=json.load(sys.stdin); deploys=d.get('deployments',[{}]); print(deploys[0].get('deployment_uuid','unknown') if deploys else 'unknown')" 2>/dev/null || echo "unknown")
          echo "deployment_uuid=${DEPLOY_UUID}" >> $GITHUB_OUTPUT
          # A 2xx alone is not proof the deploy was queued — the body must
          # carry a real deployment UUID (see issue #430 run #206).
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] && [ -n "${DEPLOY_UUID}" ] && [ "${DEPLOY_UUID}" != "unknown" ]; then
            echo "✅ Deploy triggered (uuid: ${DEPLOY_UUID})"
          else
            echo "❌ Deploy not queued (HTTP ${HTTP_CODE}, uuid: ${DEPLOY_UUID})"
            exit 1
          fi

      - name: Wait for Coolify deployment to finish
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          if [ -z "${DEPLOYMENT_UUID}" ] || [ "${DEPLOYMENT_UUID}" = "unknown" ]; then
            echo "❌ No deployment UUID to poll"
            exit 1
          fi
          for i in $(seq 1 90); do
            BODY=$(curl -s -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "https://dev.7rb.nl/api/v1/deployments/${DEPLOYMENT_UUID}")
            STATUS=$(echo "${BODY}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || true)
            echo "[$i] deployment status: ${STATUS}"
            case "${STATUS}" in
              finished) echo "✅ Coolify deployment finished"; exit 0 ;;
              failed|error|cancelled) echo "❌ Coolify deployment ${STATUS}"; exit 1 ;;
              '?') echo "⚠️  Empty/invalid deployment status response — will keep polling but this should not happen"; ;;
            esac
            sleep 15
          done
          echo "❌ Timed out waiting for Coolify deployment"
          exit 1

      # Post-deploy health gate (issue #430). The deploy run #206 reported
      # "finished" from Coolify's perspective while the container was actually
      # crashed (SECRET_KEY missing -> pydantic ValidationError at startup ->
      # healthcheck never passed -> 503). Coolify's deployment status alone is
      # not proof the app serves traffic, so verify the real health endpoints
      # before declaring the deploy successful.
      #
      # Gate: /health/live (liveness) AND /health/ready (readiness — DB and
      # Redis reachable) must return HTTP 200 with {"status": "ok"}.  Liveness
      # alone can false-pass a container that is serving 503s or has lost its
      # database; readiness is what the release smoke gate checks, so the
      # deploy gate matches that convention (issue #430 follow-up).
      #
      # The host is the domain Coolify resolves for the application (see the
      # resolve step), not a committed literal: a Compose application is served
      # on its Compose service domain, so a stale hard-coded host would poll a
      # route that this deployment never owned.
      - name: Verify app health
        run: |
          check_endpoint() {
            local URL="$1"
            local NAME="$2"
            echo "Polling ${URL} for HTTP 200 + status ok..."
            for i in $(seq 1 20); do
              BODY=$(curl -s --max-time 15 "${URL}" || true)
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${URL}" || true)
              STATUS=$(echo "${BODY}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || true)
              echo "[$i] ${NAME}: HTTP ${HTTP_CODE} status=${STATUS}"
              if [ "${HTTP_CODE}" = "200" ] && [ "${STATUS}" = "ok" ]; then
                echo "✅ ${NAME} is healthy (${URL})"
                return 0
              fi
              sleep 15
            done
            echo "❌ ${NAME} did not become healthy (last HTTP ${HTTP_CODE}, status ${STATUS})"
            return 1
          }
          check_endpoint "${COOLIFY_APP_DOMAIN}/health/live" "liveness" || exit 1
          check_endpoint "${COOLIFY_APP_DOMAIN}/health/ready" "readiness" || exit 1
          echo "✅ App is healthy (liveness + readiness)"
