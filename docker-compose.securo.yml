name: finance-sync-securo

services:
  securo-db:
    image: pgvector/pgvector:pg16
    container_name: finance-sync-securo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securo
    volumes:
      - securo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securo"]
      interval: 5s
      timeout: 3s
      retries: 20

  securo-redis:
    image: redis:8-alpine
    container_name: finance-sync-securo-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  securo-backend:
    build: ./var/securo-test/backend
    container_name: finance-sync-securo-backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${SECURO_BACKEND_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@securo-db:5432/securo
      REDIS_URL: redis://securo-redis:6379/0
      SECRET_KEY: ${SECURO_SECRET_KEY:-local-securo-test-secret}
      DEBUG: "true"
      FRONTEND_URL: ${SECURO_FRONTEND_URL:-http://localhost:3001}
      STORAGE_LOCAL_PATH: /app/data/attachments
      AGENTS_KNOWLEDGE_STORAGE_PATH: /app/data/agent_knowledge
    volumes:
      - ./var/securo-test/backend:/app
      - securo_attachments:/app/data/attachments
      - securo_agent_knowledge:/app/data/agent_knowledge
    depends_on:
      securo-db: { condition: service_healthy }
      securo-redis: { condition: service_healthy }

  securo-frontend:
    build:
      context: ./var/securo-test/frontend
      dockerfile: Dockerfile.dev
    container_name: finance-sync-securo-frontend
    ports:
      - "${SECURO_FRONTEND_PORT:-3001}:5173"
    environment:
      BACKEND_URL: http://securo-backend:8000
      FRONTEND_URL: ${SECURO_FRONTEND_URL:-http://localhost:3001}
    volumes:
      - ./var/securo-test/frontend:/app
      - /app/node_modules
    depends_on:
      - securo-backend

volumes:
  securo_pgdata:
  securo_attachments:
  securo_agent_knowledge:
