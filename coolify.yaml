# ==============================================================================
# Coolify Deployment Configuration — finance-sync
# ==============================================================================
# This file documents the Coolify deployment setup for finance-sync.
# The application is deployed as a Docker Compose stack (see
# docker-compose.coolify.yml).  Coolify must create both the `app` and
# singleton `worker` services; a single API container does not run scheduled
# syncs or Wealthfolio delivery.
#
# Deployment type: Docker Compose
# Base directory: finance-sync/
# Dockerfile: Dockerfile (production) / docker/Dockerfile.dev (dev)
#
# ── Coolify Setup Instructions ─────────────────────────────────────────────────────
#
# 1. Create a new "Docker Compose" resource in Coolify.
#
# 2. Set the "Compose file" path to: docker-compose.yml
#
# 3. Configure build pack:
#    - Build pack: "docker-compose"
#    - Docker Compose file: docker-compose.yml
#    - .env file: .env (generated from .env.example)
#
# 4. Environment Variables (set in Coolify's dashboard or .env):
#
#    ┌──────────────────────────────────┬──────────┬──────────────────────────────┐
#    │ Variable                         │ Required │ Notes                        │
#    ├──────────────────────────────────┼──────────┼──────────────────────────────┤
#    │ APP_ENVIRONMENT                  │ No       │ Default: prod                │
#    │ LOG_LEVEL                        │ No       │ Default: INFO                │
#    │ GLITCHTIP_ENABLED                │ No       │ Default: false               │
#    │ GLITCHTIP_DSN                    │ No       │ Secret project DSN           │
#    │ GLITCHTIP_TRACES_SAMPLE_RATE     │ No       │ Default: 0.01                │
#    │ POSTGRES_DB                      │ No       │ Default: finance_sync        │
#    │ POSTGRES_USER                    │ No       │ Default: finance_sync        │
#    │ POSTGRES_PASSWORD                │ YES ⚠️   │ Secret — use Coolify's       │
#    │                                  │          │ "secret" variable type       │
#    │ DATABASE_URL                     │ Alt      │ Overrides POSTGRES_* vars if │
#    │                                  │          │ set                          │
#    │ REDIS_PASSWORD                   │ No       │ Empty = no password          │
#    │ REDIS_URL                        │ Alt      │ Overrides host derivation    │
#    │ SECRET_KEY                       │ YES ⚠️   │ ≥16 chars. Secret variable.  │
#    │ ADMIN_KEY                        │ YES ⚠️   │ Exactly 32 chars; generate   │
#    │                                  │          │ with scripts/generate-admin- │
#    │                                  │          │ key.sh; first-run admin auth │
#    │                                  │          │ does not use email/password. │
#    │ ACCESS_TOKEN_EXPIRE_MINUTES      │ No       │ Default: 30                  │
#    │ REFRESH_TOKEN_EXPIRE_DAYS        │ No       │ Default: 7                   │
#    │ JWT_ALGORITHM                    │ No       │ Default: HS256               │
#    │ MASTER_ENCRYPTION_KEY            │ Required │ openssl rand -hex 32. Secret │
#    │                                  │ for cred  │ variable.                    │
#    │                                  │ enc.      │                              │
#    │ CORS_ORIGINS                     │ No       │ Default: *                   │
#    │                                  │          │ ⚠️ PROD: must be an explicit │
#    │                                  │          │ non-wildcard allowlist — the │
#    │                                  │          │ production settings validator│
#    │                                  │          │ (Settings._validate_prod-    │
#    │                                  │          │ uction_security) rejects `*`│
#    │                                  │          │ or an empty list at startup │
#    │                                  │          │ (e.g. ["https://<app-fqdn>"])│
#    └──────────────────────────────────┴──────────┴──────────────────────────────┘
#
# 5. Volume Mounts:
#
#    - postgres_data: Persistent PostgreSQL storage
#    - redis_data:    Persistent Redis storage
#    - encryption_keys: Volume for encryption key files (future use)
#
# 6. Ports:
#
#    - app: internal 8000 → map to Coolify domain / port
#    - postgres: internal 5432 (should NOT be exposed externally)
#    - redis: internal 6379 (should NOT be exposed externally)
#
# 7. Health Checks (configured in docker-compose.yml / Coolify app):
#
#    - app:      GET /health/live (port 8000)
#    - postgres: pg_isready
#    - redis:    redis-cli ping
#
#    NOTE (issue #233): when Coolify manages the app-level healthcheck
#    itself (custom_healthcheck_found=false) it injects a **wget**-based
#    probe.  The production image ships BOTH curl and wget (see Dockerfile)
#    so the default probe works; an explicit curl-based
#    `health_check_command` (curl -sf http://localhost:8000/health/live)
#    is also set on the staging app as a belt-and-braces measure.  Coolify's
#    validation regex rejects `||`, so omit it — curl's return code alone
#    signals failure.
#
# 8. Replicas / Scaling:
#
#    The `app` service is stateless and can be scaled horizontally.
#    The `worker` service should remain at 1 replica (singleton).
#    The `postgres` and `redis` services are stateful — keep at 1 replica.
#
# ── Database initialization ───────────────────────────────────────────────────────
#
# The `migrate` service in docker-compose.yml runs `alembic upgrade head` and
# must complete successfully before `app` or `worker` starts. A fresh Coolify
# deployment therefore initializes its database automatically; no
# pre-deployment command or manual migration step is required.
#
# ── Encryption Keys Volume ─────────────────────────────────────────────────────────
#
# The MASTER_ENCRYPTION_KEY env var is used at runtime.
# If file-based key storage is needed, mount a volume at /app/keys.
#
# ── Development ────────────────────────────────────────────────────────────────────
#
# For local development with hot reload:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This uses docker/Dockerfile.dev instead of the production Dockerfile.
# See docker-compose.dev.yml (create if needed).

# ── CI/CD Webhook (GitHub Actions → Coolify API) ──────────────────────────
# Triggered via GitHub Actions workflow (see .github/workflows/ci.yml).
# Uses POST with JSON body:
#
#   curl -X POST "${COOLIFY_BASE_URL}/api/v1/deploy" \
#     -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
#     -H "Content-Type: application/json" \
#     -d '{"uuid": "mdeal4aqq9ycnozn3mg83zix", "force": false}'
#
# Required GitHub secret: COOLIFY_API_TOKEN (deploy permission)

# ── Staging Stack (release pipeline, G-12) ─────────────────────────────────
# The protected release pipeline (.github/workflows/release.yml) deploys a
# dedicated staging stack before promoting to production.  Full reference in
# docs/RELEASING.md; provisioning runbook in scripts/provision-staging.sh.
#
# Stack (finance-sync project → development environment, homelab server):
#   App:         finance-sync-staging  (dockerfile build pack, repo
#                rbnbrls/finance-sync@main, port 8000, health /health/live,
#                FQDN https://mdeal4aqq9ycnozn3mg83zix.7rb.nl)
#   PostgreSQL:  finance-sync-staging-pg   (postgres:16-alpine, internal)
#   Redis:       finance-sync-staging-redis (redis:7-alpine, internal)
#
# Staging app environment (values generated by scripts/provision-staging.sh):
#   APP_ENVIRONMENT=staging
#   STAGING_CONNECTOR_BASE_URL=https://<app-fqdn>/api/v1/staging-providers
#   DATABASE_URL=postgresql+asyncpg://finance_sync:<pw>@<pg-uuid>:5432/finance_sync
#   REDIS_URL=redis://default:<pw>@<redis-uuid>:6379/0
#   SECRET_KEY=<random ≥16 chars>
#   MASTER_ENCRYPTION_KEY=<openssl rand -hex 32>
#   LOG_LEVEL=INFO
#   CORS_ORIGINS=["*"]
#
# Wealthfolio live delivery (set as Coolify secret/config variables, never in
# git; apply identically to app and worker):
#   EXPORTER_WEALTHFOLIO_ENABLED=true
#   WEALTHFOLIO_SERVER_URL=<approved self-hosted Wealthfolio URL>
#   WEALTHFOLIO_PASSWORD=<Coolify secret>
#   WORKER_JOB_EXPORT_ENABLED=true
#   WORKER_JOB_BUNQ_SYNC_ENABLED=true
#   WORKER_JOB_TRADING212_SYNC_ENABLED=true
#   BUNQ_API_KEY / TRADING212_API_KEY / TRADING212_API_SECRET=<secrets>
# Configure connector credentials through POST /api/v1/connectors/configs so
# they are encrypted in the existing connection store; do not use provider
# credentials as plaintext deployment variables unless the connector contract
# explicitly requires it.
#
# The Compose `migrate` service applies the schema before the app and worker
# start. The release pipeline still validates the migration chain separately
# against a scratch PostgreSQL before anything deploys.
#
# Rollback = image rollback + backward-compatible migrations; runbook in
# docs/RELEASING.md.
