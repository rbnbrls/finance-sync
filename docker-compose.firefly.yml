# Local-only Firefly III playground. Nothing here is intended for production.
services:
  firefly-db:
    image: mariadb:11.4
    container_name: finance-sync-firefly-db
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: firefly
      MYSQL_USER: firefly
      MYSQL_PASSWORD: firefly-local-password
    volumes:
      - firefly_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15

  firefly:
    image: fireflyiii/core:latest
    container_name: finance-sync-firefly
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      APP_ENV: local
      APP_KEY: ${FIREFLY_APP_KEY:-base64:fGd1IMoKkHuWZaQEEymUiJaEXnwAycat+9XbPqAC0tw=}
      SITE_OWNER: ${FIREFLY_SITE_OWNER:-local@example.test}
      DB_CONNECTION: mysql
      DB_HOST: firefly-db
      DB_PORT: 3306
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: firefly-local-password
      TRUSTED_PROXIES: "**"
      LOG_CHANNEL: stderr
      TZ: Europe/Amsterdam
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    depends_on:
      firefly-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(file_get_contents('http://localhost:8080/health') === false ? 1 : 0);\""]
      interval: 15s
      timeout: 5s
      retries: 20

  firefly-importer:
    image: fireflyiii/data-importer:latest
    container_name: finance-sync-firefly-importer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      FIREFLY_III_URL: http://firefly:8080
      VANITY_URL: http://localhost:8081
      IMPORT_DIR_ALLOWLIST: /import
      TRUSTED_PROXIES: "**"
      TZ: Europe/Amsterdam
    volumes:
      - ./var/firefly-import:/import
    depends_on:
      firefly:
        condition: service_healthy

volumes:
  firefly_db:
  firefly_upload:
