services:
  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finance-sync-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_sync}
      POSTGRES_USER: ${POSTGRES_USER:-finance_sync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_sync} -d ${POSTGRES_DB:-finance_sync}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Database schema ────────────────────────────────────────────────
  # Run migrations once before either long-running service starts. The
  # database user owns the database, so a separate migration role is not
  # needed for this single-installation deployment.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finance_sync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finance_sync}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finance-sync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── FastAPI Application ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-sync-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-prod}
      APP_NAME: ${APP_NAME:-finance-sync}
      APP_VERSION: ${APP_VERSION:-0.7.3}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GLITCHTIP_ENABLED: ${GLITCHTIP_ENABLED:-false}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_SAMPLE_RATE: ${GLITCHTIP_SAMPLE_RATE:-1.0}
      GLITCHTIP_TRACES_SAMPLE_RATE: ${GLITCHTIP_TRACES_SAMPLE_RATE:-0.01}
      GLITCHTIP_RELEASE: ${GLITCHTIP_RELEASE:-}
      GLITCHTIP_MAX_BREADCRUMBS: ${GLITCHTIP_MAX_BREADCRUMBS:-20}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finance_sync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finance_sync}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-2}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-10}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY is required; run scripts/generate-admin-key.sh}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      EXPORTER_ACTUAL_BUDGET_ENABLED: ${EXPORTER_ACTUAL_BUDGET_ENABLED:-true}
      ACTUAL_BUDGET_SERVER_URL: ${ACTUAL_BUDGET_SERVER_URL:-http://actual-budget:5006}
      ACTUAL_BUDGET_PASSWORD: ${ACTUAL_BUDGET_PASSWORD:-}
      ACTUAL_BUDGET_BUDGET_NAME: ${ACTUAL_BUDGET_BUDGET_NAME:-Finance Sync Local}
      ACTUAL_BUDGET_SYNC_ID: ${ACTUAL_BUDGET_SYNC_ID:-}
      ACTUAL_BUDGET_ENCRYPTION_PASSWORD: ${ACTUAL_BUDGET_ENCRYPTION_PASSWORD:-}
      EXPORTER_FIREFLY_ENABLED: ${EXPORTER_FIREFLY_ENABLED:-true}
      FIREFLY_SERVER_URL: ${FIREFLY_SERVER_URL:-http://firefly:8080}
      FIREFLY_ACCESS_TOKEN: ${FIREFLY_ACCESS_TOKEN:-}
      FIREFLY_DEFAULT_CURRENCY: ${FIREFLY_DEFAULT_CURRENCY:-EUR}
      FIREFLY_IMPORT_TAG: ${FIREFLY_IMPORT_TAG:-finance-sync}
      EXPORTER_INVESTBRAIN_ENABLED: ${EXPORTER_INVESTBRAIN_ENABLED:-true}
      INVESTBRAIN_SERVER_URL: ${INVESTBRAIN_SERVER_URL:-http://investbrain-app:80}
      INVESTBRAIN_ACCESS_TOKEN: ${INVESTBRAIN_ACCESS_TOKEN:-}
      INVESTBRAIN_VERIFY_SSL: ${INVESTBRAIN_VERIFY_SSL:-true}
      INVESTBRAIN_INCLUDE_PENDING: ${INVESTBRAIN_INCLUDE_PENDING:-false}
      INVESTBRAIN_PORTFOLIO_NAME_PREFIX: ${INVESTBRAIN_PORTFOLIO_NAME_PREFIX:-finance-sync}
      EXPORTER_GHOSTFOLIO_ENABLED: ${EXPORTER_GHOSTFOLIO_ENABLED:-true}
      GHOSTFOLIO_SERVER_URL: ${GHOSTFOLIO_SERVER_URL:-http://host.docker.internal:3333}
      GHOSTFOLIO_ACCESS_TOKEN: ${GHOSTFOLIO_ACCESS_TOKEN:-}
      GHOSTFOLIO_VERIFY_SSL: ${GHOSTFOLIO_VERIFY_SSL:-true}
      GHOSTFOLIO_DATA_SOURCE: ${GHOSTFOLIO_DATA_SOURCE:-MANUAL}
      GHOSTFOLIO_INCLUDE_PENDING: ${GHOSTFOLIO_INCLUDE_PENDING:-false}
      GHOSTFOLIO_SYNC_TRANSACTIONS: ${GHOSTFOLIO_SYNC_TRANSACTIONS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8000"]}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-rbnbrls/finance-sync}
      DEGIRO_IMPORT_STAGING_DIRECTORY: /tmp/finance-sync/import-staging
    volumes:
      - encryption_keys:/app/keys  # Mount for encryption key files if needed
      - degiro_import_staging:/var/lib/finance-sync/import-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Background Worker ───────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-sync-worker
    restart: unless-stopped
    entrypoint: ["python", "-m", "finance_sync.worker"]
    ports:
      - "9090:9090"
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GLITCHTIP_ENABLED: ${GLITCHTIP_ENABLED:-false}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_SAMPLE_RATE: ${GLITCHTIP_SAMPLE_RATE:-1.0}
      GLITCHTIP_TRACES_SAMPLE_RATE: ${GLITCHTIP_TRACES_SAMPLE_RATE:-0.01}
      GLITCHTIP_RELEASE: ${GLITCHTIP_RELEASE:-}
      GLITCHTIP_MAX_BREADCRUMBS: ${GLITCHTIP_MAX_BREADCRUMBS:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8000"]}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finance_sync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finance_sync}
      DATABASE_POOL_MIN_SIZE: 1
      DATABASE_POOL_MAX_SIZE: 2
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY is required; run scripts/generate-admin-key.sh}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      EXPORTER_ACTUAL_BUDGET_ENABLED: ${EXPORTER_ACTUAL_BUDGET_ENABLED:-true}
      ACTUAL_BUDGET_SERVER_URL: ${ACTUAL_BUDGET_SERVER_URL:-http://actual-budget:5006}
      ACTUAL_BUDGET_PASSWORD: ${ACTUAL_BUDGET_PASSWORD:-}
      ACTUAL_BUDGET_BUDGET_NAME: ${ACTUAL_BUDGET_BUDGET_NAME:-Finance Sync Local}
      ACTUAL_BUDGET_SYNC_ID: ${ACTUAL_BUDGET_SYNC_ID:-}
      ACTUAL_BUDGET_ENCRYPTION_PASSWORD: ${ACTUAL_BUDGET_ENCRYPTION_PASSWORD:-}
      EXPORTER_FIREFLY_ENABLED: ${EXPORTER_FIREFLY_ENABLED:-true}
      FIREFLY_SERVER_URL: ${FIREFLY_SERVER_URL:-http://firefly:8080}
      FIREFLY_ACCESS_TOKEN: ${FIREFLY_ACCESS_TOKEN:-}
      FIREFLY_DEFAULT_CURRENCY: ${FIREFLY_DEFAULT_CURRENCY:-EUR}
      FIREFLY_IMPORT_TAG: ${FIREFLY_IMPORT_TAG:-finance-sync}
      EXPORTER_INVESTBRAIN_ENABLED: ${EXPORTER_INVESTBRAIN_ENABLED:-true}
      INVESTBRAIN_SERVER_URL: ${INVESTBRAIN_SERVER_URL:-http://investbrain-app:80}
      INVESTBRAIN_ACCESS_TOKEN: ${INVESTBRAIN_ACCESS_TOKEN:-}
      INVESTBRAIN_VERIFY_SSL: ${INVESTBRAIN_VERIFY_SSL:-true}
      INVESTBRAIN_INCLUDE_PENDING: ${INVESTBRAIN_INCLUDE_PENDING:-false}
      INVESTBRAIN_PORTFOLIO_NAME_PREFIX: ${INVESTBRAIN_PORTFOLIO_NAME_PREFIX:-finance-sync}
      EXPORTER_GHOSTFOLIO_ENABLED: ${EXPORTER_GHOSTFOLIO_ENABLED:-true}
      GHOSTFOLIO_SERVER_URL: ${GHOSTFOLIO_SERVER_URL:-http://host.docker.internal:3333}
      GHOSTFOLIO_ACCESS_TOKEN: ${GHOSTFOLIO_ACCESS_TOKEN:-}
      GHOSTFOLIO_VERIFY_SSL: ${GHOSTFOLIO_VERIFY_SSL:-true}
      GHOSTFOLIO_DATA_SOURCE: ${GHOSTFOLIO_DATA_SOURCE:-MANUAL}
      GHOSTFOLIO_INCLUDE_PENDING: ${GHOSTFOLIO_INCLUDE_PENDING:-false}
      GHOSTFOLIO_SYNC_TRANSACTIONS: ${GHOSTFOLIO_SYNC_TRANSACTIONS:-true}
      WORKER_HEALTH_PORT: 9090
      WORKER_JOB_DEGIRO_WATCH_ENABLED: ${WORKER_JOB_DEGIRO_WATCH_ENABLED:-true}
      DEGIRO_IMPORT_STAGING_DIRECTORY: /tmp/finance-sync/import-staging
    volumes:
      - encryption_keys:/app/keys:ro
      - ${DEGIRO_WATCH_HOST_PATH:-./imports/degiro}:/imports/degiro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9090/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  encryption_keys:
    driver: local
  degiro_import_staging:
    driver: local
