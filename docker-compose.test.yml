# Ephemeral PostgreSQL + Redis for the integration test suite.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   make test-integration
#
# The harness reads TEST_DATABASE_URL / TEST_REDIS_URL (see
# tests/integration/conftest.py).  The default Makefile target points at
# these service ports.  Nothing here touches your dev database: the
# integration fixtures create their own schema and a dedicated database
# for the migration tests.
name: finance-sync-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_sync_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_sync_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
