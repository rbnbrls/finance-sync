# ── Grafana Alerting — provisioned alert rules ─────────────────────
# Loaded automatically by Grafana from /etc/grafana/provisioning/alerting.
# Every rule queries the provisioned Prometheus datasource (uid
# "prometheus") and evaluates against the metrics emitted by the app
# (app:8000/metrics) and worker (worker:9090/metrics) scrape targets.
#
# Channel for every rule: contact point "Finance Sync" (see
# alerting.yaml in this directory).  Full inventory + silencing
# instructions: docs/observability.md.
apiVersion: 1

groups:
  - orgId: 1
    name: Finance Sync Health
    folder: Finance Sync
    interval: 1m
    rules:
      # ── Failed sync runs ───────────────────────────────────────────
      - uid: finance-sync-failed-sync-runs
        title: Failed sync runs
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              expr: increase(sync_runs_total{status="failed"}[15m])
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
        for: 5m
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "Sync runs are failing"
          description: >-
            At least one sync run failed in the last 15 minutes
            ({{ $labels.provider }}). Check logs and the Sync Health
            dashboard for the failing connector.
          runbook_url: "https://github.com/rbnbrls/finance-sync/blob/main/docs/observability.md"

      # ── Stale enrichment (>24h) ────────────────────────────────────
      - uid: finance-sync-stale-enrichment
        title: Enrichment data is stale (>24h)
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              expr: >-
                (time() - enrichment_last_success_timestamp) > 86400
                or absent(enrichment_last_success_timestamp)
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
        for: 30m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Enrichment has not succeeded in over 24 hours"
          description: >-
            enrichment_last_success_timestamp is older than 24h or has
            never been set. The enrich_prices worker job may be failing
            or disabled (worker_job_enrich_prices_enabled).
          runbook_url: "https://github.com/rbnbrls/finance-sync/blob/main/docs/observability.md"

      # ── Outbox backlog ─────────────────────────────────────────────
      - uid: finance-sync-outbox-backlog
        title: Outbox backlog is growing
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              expr: outbox_messages_pending_total
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
                  operator:
                    type: and
        for: 10m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Outbox backlog above 50 pending messages"
          description: >-
            {{ $values.A }} outbox messages are pending publication.
            The outbox publisher job (process_outbox) may be stuck or a
            downstream handler (webhook) is failing.
          runbook_url: "https://github.com/rbnbrls/finance-sync/blob/main/docs/observability.md"

      # ── Export run failures ────────────────────────────────────────
      - uid: finance-sync-export-failures
        title: Export runs are failing
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              expr: increase(export_runs_total{status="failed"}[1h])
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
        for: 5m
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "An exporter run failed in the last hour"
          description: >-
            {{ $labels.exporter }} export failed
            ({{ $values.A }} failure(s) in the last hour). Check the
            exporter logs and the Actual Budget / Wealthfolio config.
          runbook_url: "https://github.com/rbnbrls/finance-sync/blob/main/docs/observability.md"

      # ── Worker down ────────────────────────────────────────────────
      - uid: finance-sync-worker-down
        title: Worker process is down
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: up{job="finance-sync-worker"} == 0
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
        for: 2m
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "finance-sync-worker is not being scraped"
          description: >-
            Prometheus cannot scrape the worker health endpoint
            (worker:9090/metrics). Restart the worker container:
            docker compose restart worker.
          runbook_url: "https://github.com/rbnbrls/finance-sync/blob/main/docs/observability.md"

      # ── App down ───────────────────────────────────────────────────
      - uid: finance-sync-app-down
        title: App process is down
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: up{job="finance-sync-app"} == 0
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
        for: 2m
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "finance-sync-app is not being scraped"
          description: >-
            Prometheus cannot scrape the API metrics endpoint
            (app:8000/metrics). Restart the app container:
            docker compose restart app.
          runbook_url: "https://github.com/rbnbrls/finance-sync/blob/main/docs/observability.md"
