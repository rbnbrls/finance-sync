# ── Grafana Alerting provisioning — contact points & policies ──────
# Loaded automatically from /etc/grafana/provisioning/alerting.
#
# Alert RULES live in finance-sync.rules.yaml (same directory); Grafana
# treats *.rules.yaml files as alert-rule definitions and everything else
# in this directory as notification config.
#
# CHANNELS (documented in docs/observability.md):
#   - Default: alerts appear in the Grafana Alerting UI and are routed to
#     the "Finance Sync" contact point below.
#   - Webhook: set GRAFANA_ALERT_WEBHOOK_URL (Slack/Discord/Telegram/…)
#     to receive push notifications.  Default is a no-op placeholder.
#   - Email: set GRAFANA_ALERT_EMAILS + GF_SMTP_* to enable email.
#   - Silence: use the Alerting → Silence button, or the provisioned
#     `maintenance-window` mute timing.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: Finance Sync
    receivers:
      - uid: finance-sync-webhook
        type: webhook
        settings:
          url: ${GRAFANA_ALERT_WEBHOOK_URL}
          httpMethod: POST
        disableResolveMessage: false
      - uid: finance-sync-email
        type: email
        settings:
          addresses: ${GRAFANA_ALERT_EMAILS}
          singleEmail: false
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: Finance Sync
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes: []

muteTimes:
  - orgId: 1
    name: maintenance-window
    time_intervals:
      # Example: suppress notifications on weekend nights.
      # Add more intervals here or create silences in the UI.
      - times:
          - start: "22:00"
            end: "08:00"
        weekdays:
          - saturday
          - sunday
