# Wealthfolio reverse proxy — forwards to the Wealthfolio server on the
# homelab LAN (LXC 104, 192.168.3.50:8080).  TLS is terminated by Traefik
# (Coolify) in front of this container, so this only listens on HTTP inside
# the Coolify docker network.
#
# Notes:
# - Host header is forwarded so Wealthfolio issues cookies for the public
#   hostname and the PWA loads assets from the same origin (no CORS needed
#   for same-origin clients).
# - Server-Sent Events (the Wealthfolio UI live-updates via SSE) must not be
#   buffered: proxy_buffering off + aggressive timeouts.
# - Upstream is pinned to the LAN IP; the Wealthfolio port (8080) is not
#   exposed outside this proxy chain.
#
# Traefik terminates TLS and forwards X-Forwarded-Proto: https.  Pass that
# through (this listener is plain HTTP, so $scheme alone would always be
# http and clobber the real scheme — which would make downstream frameworks
# issue non-Secure session cookies).  Fall back to $scheme when Traefik
# does not send the header.
map $http_x_forwarded_proto $wf_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Same-origin proxying: keep the public hostname end-to-end.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wf_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    # Wealthfolio SPA + PWA static assets.
    location / {
        proxy_pass http://192.168.3.50:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE support (Wealthfolio UI uses server-sent events).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Health check path served by this proxy itself.
        add_header X-Wealthfolio-Proxy finance-sync;

        client_max_body_size 64m;
    }
}
